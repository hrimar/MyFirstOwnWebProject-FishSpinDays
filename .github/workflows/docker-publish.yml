name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/Docker-integration

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Run .NET Unit Tests
      run: dotnet test ./FishSpinDays/FishSpinDays.Tests/FishSpinDays.Tests.csproj --verbosity normal

    - name: Set safe Docker tag
      id: vars
      run: |
        SAFE_TAG_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
        echo "TAG_NAME=$SAFE_TAG_NAME" >> $GITHUB_ENV

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./FishSpinDays
        file: ./FishSpinDays/Dockerfile
        push: true
        tags: |
          hrimar/fishspin:${{ env.TAG_NAME }}
          ${{ env.TAG_NAME == 'master' && 'hrimar/fishspin:latest' || '' }}
