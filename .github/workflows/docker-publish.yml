name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/Docker-integration

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Run .NET Unit Tests
      run: dotnet test ./FishSpinDays/FishSpinDays.Tests/FishSpinDays.Tests.csproj --verbosity normal

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: FishSpinDays.Web/Dockerfile
        push: true
        tags: |
          hrimar/fishspin:${{ github.ref_name }}
          ${{ github.ref_name == 'master' && 'hrimar/fishspin:latest' || '' }}